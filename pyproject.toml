[project]
name = "ergane-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ergane-cli==0.2.0",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

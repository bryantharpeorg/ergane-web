# Generated by `ergane init --wire`: one job per gate declared in ergane.yaml.
#
# The job names below ARE the gate names. GitHub names each check run after the
# job's `name`, and the merge queue requires a check named after each declared
# gate — rename a job here and the factory refuses to dispatch against this repo.
#
# Operator additions (D-011): the toolchain setup each gate needs. `uv` owns the
# backend, `npm` owns web/; the smoke gate drives headless Chromium through
# Playwright. Until spec 001's scaffold story lands, these jobs fail — that is the
# manifest's contract (a gate whose command is not installed is a FAIL, not a skip).
name: ergane gates

on:
  pull_request:
  merge_group:

jobs:
  smoke:
    name: "smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - name: "smoke"
        run: "npm --prefix web run test:smoke"

  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: "test"
        run: "uv run pytest -q"

  typecheck:
    name: "typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - name: "typecheck"
        run: "npm --prefix web run typecheck"

  unit:
    name: "unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - name: "unit"
        run: "npm --prefix web run test:unit"

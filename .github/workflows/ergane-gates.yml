# Generated by `ergane init --wire`: one job per gate declared in ergane.yaml.
#
# The job names below ARE the gate names. GitHub names each check run after the
# job's `name`, and the merge queue requires a check named after each declared
# gate — rename a job here and the factory refuses to dispatch against this repo.
#
# Operator additions (D-011): the toolchain setup each gate needs. `uv` owns the
# backend, `npm` owns web/; the smoke gate drives headless Chromium through
# Playwright. Until spec 001's scaffold story lands, these jobs fail — that is the
# manifest's contract (a gate whose command is not installed is a FAIL, not a skip).
name: ergane gates

on:
  pull_request:
  merge_group:

jobs:
  smoke:
    name: "smoke"
    runs-on: ubuntu-latest
    steps:
      # Full history, for this gate alone: since 009 the Showfloor reads landing
      # facts off the landing branch, and `actions/checkout`'s default depth-1
      # single-branch clone carries no `dev` for it to read. The room degrades
      # honestly when the branch is unreadable — every story under the Unknown
      # Rule, the failed read named (FR-004) — so this is not a correctness
      # fix; it is what stops the smoke suite sweeping a wholly degraded room
      # the operator never sees, which is the sandbox/runner divergence the 009
      # plan names as its own class of trap. The other three gates start no
      # pane and read no branch, so they keep the shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `fetch-depth: 0` above is a REQUEST, and on 2026-08-26 it was not the
      # result. Measured on this runner, from the pane's own working directory:
      #
      #     rev-parse(origin/dev)=7004b7b92d52…  commits-on-origin/dev=1
      #     is-shallow=true
      #
      # One commit. So `landed_facts` walked a history containing exactly one
      # landing and every spec read as an epic that never landed — spec 001
      # reported four of four stories unmerged with all four on the branch. The
      # room then refused, correctly by its own rules, and eleven smoke tests
      # failed on a floor that had nothing wrong with it. That is what killed
      # 011/us2's whole ladder overnight and cascade-killed us3 behind it: no
      # attempt could have passed, and no retry could have changed it.
      #
      # Reproduced exactly with `git clone --depth 1` and cured exactly by
      # unshallowing: 89 commits, every landed spec answering 200.
      #
      # So this step verifies rather than assumes. It is idempotent, costs
      # nothing when the history is already complete, and never fails the gate
      # on its own — a repository that cannot be deepened is reported here and
      # left to the rooms to degrade over.
      - name: "guarantee the landing branch's history"
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "shallow checkout detected; deepening"
            git fetch --unshallow origin || git fetch --deepen=2147483647 origin || true
          fi
          echo "is-shallow=$(git rev-parse --is-shallow-repository)"
          echo "commits reachable from origin/${GITHUB_BASE_REF:-dev}: $(git rev-list --count "origin/${GITHUB_BASE_REF:-dev}" 2>/dev/null || echo unknown)"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - name: "smoke"
        run: |
          # The deepening happens HERE, not in a step of its own, and that is the
          # whole point. A separate step reported `is-shallow=false` with 90
          # commits at 17:42:43 and the suite three minutes later read the same
          # directory as shallow with one commit -- same job, same runner, same
          # toplevel. Nothing between them touches git: setup-uv, setup-node,
          # `uv sync`, `npm ci`, `playwright install`, and no npm script in this
          # repository runs git at all. What re-shallows it is still unidentified.
          #
          # So this stops depending on knowing. Deepening immediately before the
          # command that needs the history makes whatever happens earlier
          # irrelevant, and the echo below is the receipt: if the suite ever fails
          # this way again, the line above the failure says whether the history
          # was there when the tests started.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "shallow at gate time; deepening"
            git fetch --unshallow origin || git fetch --deepen=2147483647 origin || true
          fi
          echo "at gate time: is-shallow=$(git rev-parse --is-shallow-repository) commits-on-origin/${GITHUB_BASE_REF:-dev}=$(git rev-list --count "origin/${GITHUB_BASE_REF:-dev}" 2>/dev/null || echo unknown)"
          npm --prefix web run test:smoke

  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: "test"
        run: "uv run pytest -q --cov=pane --cov-report=term-missing --cov-report=xml"

  typecheck:
    name: "typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - name: "typecheck"
        run: "npm --prefix web run typecheck"

  unit:
    name: "unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 015 US2: `@vitest/coverage-v8` is a dev dependency, so `npm ci` is what
      # puts the coverage provider inside `web/node_modules` -- inside the
      # worktree, where the factory's gate boundary can also see it (D-013).
      # Nothing here fetches it at gate time and nothing caches it in `HOME`.
      - run: npm ci --prefix web
      # The command below is `ergane.yaml`'s `unit` gate verbatim, and since 015
      # US2 it measures coverage over `web/src` and fails under the floor
      # committed in `web/vitest.config.ts`. Both files changed in one diff on
      # purpose: a gate that measures at the boundary and not in the forge
      # reports two different numbers depending on who asked (FR-011).
      - name: "unit"
        run: "npm --prefix web run test:unit"

  # 015 US3, and FR-011 is why it is here at all: a gate the forge does not run
  # does not exist. `ergane.yaml` gained an `audit` gate in this same diff, so
  # this job carries the same name and runs the same command verbatim.
  #
  # What this job deliberately does NOT do is `npm ci`. `npm audit` builds its
  # tree from `web/package-lock.json` alone, which is the lockfile the story
  # asks it to audit — installing 280 packages first would audit the same file
  # more slowly and would make an offline runner fail at the install rather than
  # at the audit, where FR-010's message belongs.
  #
  # This gate is NOT in the `dev` or `main` branch ruleset, on purpose (D-024).
  # It runs here and it blocks every node at the factory's boundary; it does not
  # block the merge queue, so a human can still land the lockfile bump that
  # turns it green. Adding it to the ruleset is the operator's to do and a node
  # has neither `gh` nor admin.
  audit:
    name: "audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `pip-audit` is a backend dev dependency, so `uv sync` is what puts it in
      # `.venv` inside the worktree — the same shape as US2's coverage provider,
      # and the same reason (D-013): nothing is fetched into `HOME` at gate time
      # and nothing is cached there.
      - run: uv sync
      - name: "audit"
        run: "uv run python scripts/audit_gate.py"

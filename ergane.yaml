# What "green" means for ergane-web.
#
# This repo is a target of the sibling factory (D-003): its specs are dispatched by
# ergane against this checkout, and every node that works here reads this file to
# learn which commands decide its fate. Declared, never auto-detected.
#
# DRAFT until spec 001 lands (the repository is wired as of D-011): spec 001's scaffold
# story is what makes each command below exist and exit 0 in a fresh checkout. A
# gate whose command is not installed is a FAIL, not a skip — so this file lands
# with the scaffold, not before it.
#
# Schema v2 — ergane specs/002-verification-gating/contracts/factory-yaml.md.
# v2, not v1: schema v1 fixes the gate names to test/lint/typecheck and refuses
# anything else as CONFIG_ERROR; the pane needs unit and smoke, and v2 accepts
# declared, non-reserved gate names.

version: 2

runtime: bwrap

# Five gates, two package worlds. `uv` owns the backend, `npm` owns web/ (D-006,
# constitution VII). The npm gates assume dependencies are installed — the CI
# workflow that wiring scaffolds runs `npm ci --prefix web` before the checks, and
# spec 001's scaffold story owes a fresh checkout the same courtesy locally.
#
# Setup needs network egress: `uv sync` resolves ergane-cli from PyPI (pinned
# 0.2.0; D-011) and `npm ci` fetches packages plus the Playwright chromium binary. A sandbox that
# denies egress at gate time fails US1 by construction (001's Assumptions name
# this); provide a cached channel before dispatch if the runtime is sealed.
#
# 015 US1: the `test` gate now measures its own reach as it runs.  The flags
# turn coverage on and name the two reports FR-001 asks for -- Cobertura at the
# repository root, and a terminal summary a human reads in the gate tail.  What
# they deliberately do NOT carry is the floor: `--cov-fail-under` here would
# hide the number inside this string, so it lives in `pyproject.toml`'s
# `[tool.coverage.report] fail_under` where a reader finds it without running
# anything (plan D1, FR-003).  Both artefacts land inside the worktree, so the
# gate needs nothing from its fresh tmpfs `HOME` (FR-004, D-013).
#
# 015 US2: the `unit` gate now measures its own reach too, over `web/src`, on
# the same terms.  Its command is unchanged and that is deliberate.  The two
# reports FR-005 asks for -- vitest's `json-summary` at the declared path
# `web/coverage/coverage-summary.json`, and the `text` summary a human reads in
# the gate tail -- and the floor that fails the gate below it are configured in
# `web/vitest.config.ts`, and coverage is switched on by `--coverage` inside
# `web/package.json`'s `test:unit` script.  So `npm --prefix web run test:unit`
# means exactly the same thing at the boundary, in the forge, and on an
# operator's machine; passing the flag here instead would have made the gate
# measure something the documented local command does not.  As with the backend,
# the floor is committed rather than passed (plan D1, FR-007), and both
# artefacts land inside the worktree (D-013).
#
# 015 US3: a FIFTH gate, `audit`, inventories what this repository depends on
# and reports what is known about it -- `pip-audit` over `uv.lock`, `npm audit`
# over `web/package-lock.json`, each tool's own JSON written verbatim at the
# path `pyproject.toml`'s `[tool.audit-gate.reports]` declares (FR-008).  The
# command carries no threshold and no paths for the same reason the coverage
# gates carry no floor: a security policy passed on a command line is a policy
# hidden inside a quoted string.  Everything the gate obeys is committed in
# `[tool.audit-gate]`, where a reader finds it without running anything, and
# there is no allowlist and must not be one (D-024).
#
# It fails on the declared severity and on one other thing: a lookup that did
# not complete.  An audit that could not reach the advisory database names the
# network and refuses to print a count, because "0 vulnerabilities" from a
# question nobody answered is the failure constitution III exists to prevent
# (FR-010).
#
# `audit` is ALSO deliberately absent from the `dev` and `main` branch rulesets
# (D-024), which is the one asymmetry `CLAUDE.md` § Landing discipline admits.
# It blocks every node at the boundary -- which is what stops work landing on a
# known-vulnerable tree -- and it does not block the merge queue, so the one
# actor who can fix an overnight CVE is not locked out by the gate asking for
# the fix.  A node cannot change a ruleset and must not try.
#
# Both artefacts and both tool caches land under `audit/` inside the worktree,
# so this gate needs nothing from its fresh tmpfs `HOME` either (FR-004,
# D-013): `pip-audit` would otherwise cache into `~/.cache/pip` and `npm` into
# `~/.npm`.  Nothing in this repository reads the artefacts (SC-003).
gates:
  test: "uv run pytest -q --cov=pane --cov-report=term-missing --cov-report=xml"
  typecheck: "npm --prefix web run typecheck"
  unit: "npm --prefix web run test:unit"
  smoke: "npm --prefix web run test:smoke"
  audit: "uv run python scripts/audit_gate.py"

# The document every agent attempt in this repo is told to read and obey.
standards: .specify/memory/constitution.md

# Mirrors ergane's two-branch model: a continuous landing branch the queue owns,
# with `main` promoted by the operator at milestones. Decided at wiring (D-011):
# the operator chose `dev`; `main` is promoted from it after the build validates.
landing_branch: dev

# The verification ladder (schema v2). THREE RUNGS, THREE MODELS, set 2026-08-28
# at the operator's instruction. Each rung resolves its own persona's model from
# the registry -- verified in factory/workgraph/workflow.py, where
# `_persona_for_action` returns DEBUGGER_PERSONA for the debugger rung and
# `config.promotion_persona` for the promotion rung, and `_routing_for` reads
# that persona's entry:
#
#   rung 1  the node's own persona (implementer)  x2   the local DGX model
#   rung 2  promoter                              x1   the cheaper escalation
#   rung 3  debugger                              x1   the strongest, and last
#
# Promotion fires BEFORE the debugger (factory/verify/ladder.py:211-215), which
# is what lets rung 2 be cheaper than rung 3 rather than the other way round.
# The persona names here are roles; constitution VII keeps every model name in
# ~/.config/ergane/personas.yaml and this file learns none of them.
#
# `max_judge_retries: 1` IS LOAD-BEARING AND IS THE WHOLE REASON RUNG 1 GETS TWO
# ATTEMPTS. It shadows `max_attempts` whenever the failure is judge-driven, and
# its default is 2 -- so at the default this ladder would give rung 1 THREE
# attempts and only reach the promotion rung on the fourth. The 6/3 this repo
# carried through epic 001 is the same trap from the other side: 001/us4 spent
# nine rungs on a deterministic refusal, the last four byte-identical, because
# `max_attempts` is live only where the judge never ran. Set both dials or set
# neither.
ladder:
  max_attempts: 2
  max_judge_retries: 1
  promotion_persona: promoter
  promotion_cycles: 1
  debugger_cycles: 1

# Roadmap dials (schema v2). ONE epic at a time. 002 and 003 both depend only on
# 001 landing and were run concurrently on 2026-08-22; the merge queue did
# arbitrate their shared files, exactly as intended, by failing the second one --
# 003/us1 adds four required `Settings` fields and changes the reader protocol,
# and 002/us1's `tests/test_stage.py` was written against the old signatures. No
# conflict, two dead tests, and the second story has to be rebuilt rather than
# patched. Both epics write `pane/floor_document.py`, `pane/config.py`,
# `pane/app.py`, `pane/events.py` and `pane/readers.py`, so that toll is due on
# every remaining story. Serial is slower on paper (seven rounds instead of four)
# and cheaper in practice. Raise this to 2 again only for epics that share no
# package -- and it is still 1 below.
#
# WIDTH MOVED INTO THE EPIC INSTEAD, 2026-08-28, at the operator's ceiling of
# "no more than 2 wide". The two dials multiply: worst-case concurrent agents is
# max_concurrent_epics x max_concurrent_nodes. Going wide across EPICS is the
# bet the paragraph above already lost; going wide across the STORIES OF ONE
# epic is a different bet, because a spec author who knows two stories share a
# file has a tool the roadmap does not -- `depends_on_merged` in the Work Graph,
# which serialises exactly that pair and leaves the rest parallel. 019 is the
# worked example from the other side: its us3 avoided the `pane/showfloor.py`
# contention only because the 1-node dial made it branch after us1 merged, which
# is luck rather than declaration. At 2 nodes that luck stops being available
# and the graph has to say so.
#
# Two more facts worth having before raising either number. GATES DO NOT
# PARALLELISE: `DEFAULT_GATE_CONCURRENCY` is 1 and is a process-level bound
# across the host (factory/verify/gates.py:85), set deliberately below node
# concurrency so a gate's wall clock measures its own work and not the queue it
# waited in -- so this widens the agent phase only, and the five-gate suite
# still queues behind itself. And rung 1 now runs on the DGX's llama.cpp engine,
# which serves THREE slots; at 2 nodes that leaves one spare, and the judge does
# not compete for it because it is on Ollama Cloud.
roadmap:
  max_concurrent_epics: 1
  max_concurrent_nodes: 2
